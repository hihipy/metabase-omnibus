name: Release

on:
  # Pushing a version tag, such as 2026.11.1 or v1.0.0, builds and publishes
  # a release for it.
  push:
    tags:
      - "v*"
      - "[0-9]*"

# Publishing a release needs write access to the repository's contents.
# Attesting the build signs a statement of where each file came from, which
# needs an identity token and permission to store the attestation.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A release builds once, so a cache only costs time, and restoring
          # it has failed on this runner before.
          cache: false

      # A release is only as good as the commit it was cut from.
      - name: Test
        run: go vet ./... && go test ./...

      # Static binaries for every platform people run, with no C toolchain
      # needed (CGO_ENABLED=0). -trimpath keeps local paths out of the binary,
      # and -X stamps the tag in so `metabase-omnibus version` reports it.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="metabase-omnibus-${TAG}-${os}-${arch}"
            bin="metabase-omnibus"
            [ "$os" = windows ] && bin="metabase-omnibus.exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "build/$name/$bin" .
            cp README.md LICENSE.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      # Records that each file was built by this workflow from this tag, so
      # anyone can check a download with `gh attestation verify`.
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
