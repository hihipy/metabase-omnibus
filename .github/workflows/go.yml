name: Go

on:
  # Run on pushes to main that touch the code or the module
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".gitattributes"
      - ".github/workflows/go.yml"

  # Run on pull requests that touch the code or the module
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".gitattributes"
      - ".github/workflows/go.yml"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

# The jobs only check out, test, and build, so the token needs nothing
# beyond reading the repository.
permissions:
  contents: read

jobs:
  test:
    # The picker drives the terminal differently on Windows (console API) and
    # on macOS and Linux (stty), so each platform has to build and pass.
    strategy:
      # One broken combination should not cancel the jobs that would have told
      # us something.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "go.mod" is the floor the module declares, read from the file so the
        # check follows it when a dependency raises it; stable is what people run.
        go: ["go.mod", "stable"]
        exclude:
          # Older Go linkers write Mach-O binaries the current macOS runner's
          # dyld refuses under -race. The floor is still checked on Linux and
          # Windows, and macOS on the toolchain people actually have.
          - os: macos-latest
            go: "go.mod"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          # Dependencies are pinned in go.sum, which keys the module cache.
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs a C toolchain, which the Windows runner does
      # not set up for Go, so Windows runs the same tests without it.
      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test ./...
          else
            go test -race ./...
          fi

      - name: Build
        run: go build .
